<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ab-buy — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF3F3;
    --frame-bg: #F4F8F8;
    --surface: #FFFFFF;
    --primary: #0F3D52;
    --primary-dark: #082733;
    --accent: #DFA23E;
    --text: #16232B;
    --text-muted: #5C6E75;
    --line: #DDE6E6;
    --sold: #A7433D;
    --radius-card: 14px;
    --radius-chip: 999px;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }

  body{
    background: var(--bg);
    min-height: 100vh;
    margin: 0;
    font-family: 'Inter', sans-serif;
    color: var(--text);
  }

  body.lang-am{ font-family: 'Noto Sans Ethiopic', sans-serif; }
  body.lang-am .brand,
  body.lang-am h1, body.lang-am h2, body.lang-am h3{ font-family: 'Noto Sans Ethiopic', sans-serif; }

  h1,h2,h3{ font-family: 'Space Grotesk', sans-serif; margin:0; }

  .phone{
    width: 100%;
    min-height: 100vh;
    background: var(--frame-bg);
    overflow: visible;
    position: relative;
  }

  .screen{
    min-height: 100vh;
    width: 100%;
    overflow: visible;
    display: none;
    flex-direction: column;
    animation: fadeIn .25s ease;
  }
  .screen.active{ display:flex; }

  @keyframes fadeIn{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  /* ---- Top bar ---- */
  .topbar{
    position:relative;
    background: var(--primary);
    padding: 18px 18px 22px;
    overflow:hidden;
    flex-shrink:0;
  }
  .topbar svg.wave{
    position:absolute; left:0; right:0; bottom:-1px;
    width:100%; height:34px; display:block;
  }
  .topbar-row{
    display:flex; align-items:center; justify-content:space-between;
    position:relative; z-index:2;
  }
  .brand{
    color:#fff; font-size:22px; font-weight:700; letter-spacing:0.2px;
    display:flex; align-items:center; gap:2px;
  }
  .brand span.dot{ color: var(--accent); }
  .lang-toggle{
    display:flex; background: rgba(255,255,255,0.14); border-radius: var(--radius-chip);
    padding: 3px; gap:2px;
  }
  .lang-toggle button{
    border:none; background:transparent; color: rgba(255,255,255,0.75);
    font-size:12.5px; font-weight:600; padding:6px 11px; border-radius: var(--radius-chip);
    cursor:pointer; font-family: inherit;
  }
  .lang-toggle button.active{ background:#fff; color: var(--primary); }

  .tagline{ color: rgba(255,255,255,0.82); font-size:13px; margin-top:10px; position:relative; z-index:2; }

  .search-wrap{
    position:relative; z-index:2; margin-top:16px;
  }
  .search-wrap input{
    width:100%; border:none; border-radius: 12px; padding: 12px 14px 12px 40px;
    font-size:14px; font-family:inherit; background:#fff; color:var(--text);
    outline:none;
  }
  .search-wrap input::placeholder{ color: var(--text-muted); }
  .search-icon{
    position:absolute; left:13px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; z-index:3;
  }

  /* ---- Section blocks ---- */
  .section{ padding: 20px 24px 4px; }
  .section-title{ font-size:15px; font-weight:600; margin-bottom:10px; }

  .chip-row{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink:0; padding:8px 14px; border-radius: var(--radius-chip);
    background: var(--surface); border:1px solid var(--line);
    font-size:13px; font-weight:500; color: var(--text-muted); cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{ background: var(--primary); border-color: var(--primary); color:#fff; }

  .shop-row{ display:flex; gap:12px; overflow-x:auto; padding-bottom:6px;
    -ms-overflow-style:none; scrollbar-width:none; }
  .shop-row::-webkit-scrollbar{ display:none; }
  .shop-card{
    flex-shrink:0; width:104px; text-align:center; cursor:pointer;
  }
  .shop-avatar{
    width:64px; height:64px; border-radius:50%; margin:0 auto 6px;
    background-size:cover; background-position:center;
    border:2px solid var(--surface); box-shadow:0 0 0 2px var(--line);
  }
  .shop-card .name{ font-size:12px; font-weight:600; line-height:1.25; }

  /* ---- Product grid ---- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));
    gap:16px;
    padding: 10px 24px 100px;
  }
  .card{
    background: var(--surface); border-radius: var(--radius-card);
    overflow:hidden; cursor:pointer; border:1px solid var(--line);
  }
  .card .img-wrap{ position:relative; aspect-ratio: 1/1; background:#e6ecec; }
  .card .img-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card.sold .img-wrap img{ filter: grayscale(0.85); opacity:0.55; }
  .sold-badge{
    position:absolute; left:8px; bottom:8px; background: var(--sold); color:#fff;
    font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:6px;
  }
  .card-body{ padding:9px 10px 11px; }
  .card-body .pname{ font-size:12.5px; font-weight:500; line-height:1.3; margin-bottom:5px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.5em; }
  .card-body .price{ font-size:15px; font-weight:700; color: var(--primary-dark); }
  .card-body .shop-tag{ font-size:10.5px; color: var(--text-muted); margin-top:3px; }

  .empty-state{ text-align:center; padding: 50px 24px; color: var(--text-muted); }
  .empty-state .icon{ font-size:34px; margin-bottom:10px; }
  .empty-state p{ font-size:13.5px; margin:0; }

  /* ---- Bottom nav ---- */
  .bottomnav{
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 100;
    display:flex;
    border-top:1px solid var(--line);
    background:rgba(255,255,255,0.97);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 -4px 18px rgba(8,39,51,0.08);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .navbtn{
    flex:1; border:none; background:none; padding:10px 0 12px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    color: var(--text-muted); font-family:inherit; font-size:11px; font-weight:500;
  }
  .navbtn.active{ color: var(--primary); }
  .navbtn svg{ width:20px; height:20px; }

  /* ---- Detail / shop header ---- */
  .detail-top{
    display:flex; align-items:center; gap:10px; padding:16px;
    background: var(--primary); flex-shrink:0;
  }
  .back-btn{
    width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.15);
    border:none; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;
    flex-shrink:0;
  }
  .detail-top .title{ color:#fff; font-size:16px; font-weight:600; }

  .shop-banner{ padding: 18px 16px; display:flex; gap:12px; align-items:center; border-bottom:1px solid var(--line); }
  .shop-banner .shop-avatar{ width:56px; height:56px; margin:0; flex-shrink:0; }
  .shop-banner .meta{ min-width:0; }
  .shop-banner h2{ font-size:16px; margin-bottom:3px; }
  .shop-banner .tg{ font-size:12px; color: var(--text-muted); }

  .product-hero{ width:100%; aspect-ratio:1/1; background:#e6ecec; flex-shrink:0; }
  .product-hero img{ width:100%; height:100%; object-fit:cover; display:block; }
  .product-info{ padding:18px 16px 8px; }
  .product-info h2{ font-size:17px; line-height:1.35; margin-bottom:8px; }
  .product-info .price-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .product-info .price{ font-size:19px; font-weight:700; color: var(--primary-dark); }
  .product-info .soldtag{ font-size:11.5px; font-weight:600; color: var(--sold); background:#F7E7E5; padding:3px 9px; border-radius:6px; }
  .product-info .from-shop{
    display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--surface);
    border:1px solid var(--line); border-radius:12px; margin-bottom:14px; cursor:pointer;
  }
  .product-info .from-shop img{ width:32px; height:32px; border-radius:50%; object-fit:cover; }
  .product-info .from-shop .lbl{ font-size:11px; color:var(--text-muted); }
  .product-info .from-shop .sname{ font-size:13px; font-weight:600; }
  .product-info .desc{ white-space:pre-line; font-size:13px; color: var(--text-muted); line-height:1.6; margin-bottom:18px; }

  .cta-wrap{ padding: 0 16px 20px; }
  .cta{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:13px; border-radius:12px; border:none; cursor:pointer;
    font-family:inherit; font-size:14px; font-weight:600; text-decoration:none;
  }
  .cta.primary{ background: var(--accent); color: var(--primary-dark); }
  .cta.disabled{ background:#E4E9E9; color: var(--text-muted); pointer-events:none; }

  /* ---- Responsive full-page layout ---- */
  @media (min-width: 700px){
    .topbar{
      padding: 28px 40px 38px;
    }

    .topbar-row,
    .tagline,
    .search-wrap{
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }

    .topbar .tagline{ margin-top: 12px; }
    .topbar .search-wrap{ margin-top: 20px; }

    .section{
      max-width: 1200px;
      margin: 0 auto;
      padding-left: 24px;
      padding-right: 24px;
    }

    .grid{
      max-width: 1200px;
      margin: 0 auto;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      padding-left: 24px;
      padding-right: 24px;
      gap: 18px;
    }

    .bottomnav{
      justify-content: center;
    }

    .navbtn{
      flex: 0 1 180px;
    }

    .detail-top{
      padding-left: max(24px, calc((100vw - 1200px) / 2 + 24px));
      padding-right: max(24px, calc((100vw - 1200px) / 2 + 24px));
    }

    .shop-banner,
    .product-info,
    .cta-wrap{
      max-width: 900px;
      width: 100%;
      margin-left: auto;
      margin-right: auto;
    }

    .product-hero{
      max-width: 720px;
      margin: 0 auto;
    }

    .shop-banner{
      padding-left: 24px;
      padding-right: 24px;
    }

    .product-info{
      padding-left: 24px;
      padding-right: 24px;
    }

    .cta-wrap{
      padding-left: 24px;
      padding-right: 24px;
      padding-bottom: 100px;
    }
  }

  @media (min-width: 1100px){
    .grid{
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    }

    .card .img-wrap{
      aspect-ratio: 1 / 0.9;
    }
  }

  @media (max-width: 699px){
    .grid{
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .cta-wrap{
      padding-bottom: 100px;
    }

    .shop-banner{
      padding-bottom: 20px;
    }
  }

</style>
</head>

// ================== LIVE DATA FROM THE BOT ==================
// After you deploy the bot, put its public URL here (no trailing slash).
// Testing on your own computer? Use http://localhost:8080
const API_BASE = "https://abuy-bot.onrender.com";
const REFRESH_MS = 60000; // re-check the bot every 60 seconds

let shops = [];
let loadState = "loading"; // "loading" | "ready" | "error"
let lastSnapshot = "";

const placeholderAvatar = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><rect width="120" height="120" fill="#DDE6E6"/></svg>');

// Turns the bot's JSON into the shape the page uses.
// Sold and removed items are hidden completely.
function transformData(raw){
  return Object.values(raw).map(s => {
    const products = Object.values(s.products || {})
      .filter(p => !p.sold && !p.removed && p.price != null && p.image)
      .sort((a, b) => Number(b.id) - Number(a.id))
      .map(p => ({ id: String(p.id), price: p.price, img: API_BASE + p.image, desc: p.description || "" }));
    return {
      id: s.id,
      nameEn: s.nameEn,
      nameAm: s.nameAm,
      channel: s.channel,
      contact: s.contact || s.channel,
      category: s.category,
      avatar: products.length ? products[0].img : placeholderAvatar,
      products
    };
  }).filter(s => s.products.length > 0);
}

let state = { lang:"en", tab:"home", category:"all", query:"", shopId:null, productId:null, screen:null };

function L(){ return t[state.lang]; }
function fmt(n){ return Number(n).toLocaleString("en-US") + " ETB"; }
function categoryLabel(c){ return L().cat[c] || (c.charAt(0).toUpperCase() + c.slice(1)); }
function getCategories(){ return [...new Set(shops.map(s => s.category))]; }

// Mixes shops together (one from each in turn) so no single shop fills the top of the feed.
function allProducts(){
  const lists = shops.map(s => s.products.map(p => ({ ...p, shop: s })));
  const longest = Math.max(0, ...lists.map(l => l.length));
  const out = [];
  for(let i = 0; i < longest; i++){
    lists.forEach(l => { if(l[i]) out.push(l[i]); });
  }
  return out;
}

function filteredProducts(){
  let list = allProducts();
  if(state.category !== "all") list = list.filter(p => p.shop.category === state.category);
  const raw = state.query.trim();
  if(raw){
    const q = raw.toLowerCase();
    list = list.filter(p =>
      (p.desc + " " + p.shop.nameEn).toLowerCase().includes(q) ||
      p.desc.includes(raw) || p.shop.nameAm.includes(raw));
  }
  return list;
}

function productCard(p){
  const shopName = state.lang === "am" ? p.shop.nameAm : p.shop.nameEn;
  return `
    <div class="card" data-goto="product" data-shop="${p.shop.id}" data-product="${p.id}">
      <div class="img-wrap"><img src="${p.img}" alt="" loading="lazy"></div>
      <div class="card-body">
        <div class="price">${fmt(p.price)}</div>
        <div class="shop-tag">${shopName}</div>
      </div>
    </div>`;
}

function emptyMessage(){
  if(loadState === "loading")
    return `<div class="empty-state" style="grid-column:1/-1;"><p>${L().loading}</p></div>`;
  if(loadState === "error")
    return `<div class="empty-state" style="grid-column:1/-1;cursor:pointer;" data-retry><div class="icon">⚠</div><p>${L().loadError}</p></div>`;
  return `<div class="empty-state" style="grid-column:1/-1;"><div class="icon">⌕</div><p>${L().noResults}</p></div>`;
}

function renderHome(){
  document.getElementById("tagline").textContent = L().tagline;
  document.getElementById("search-input").placeholder = L().searchPh;
  document.getElementById("search-input").value = state.query;
  document.getElementById("lbl-categories").textContent = L().categories;
  document.getElementById("lbl-featured").textContent = L().featured;
  document.getElementById("lbl-all-products").textContent = L().allProducts;

  const cats = getCategories();
  if(state.category !== "all" && !cats.includes(state.category)) state.category = "all";

  document.getElementById("chip-row").innerHTML =
    `<div class="chip ${state.category==='all'?'active':''}" data-cat="all">${L().all}</div>` +
    cats.map(c => `<div class="chip ${state.category===c?'active':''}" data-cat="${c}">${categoryLabel(c)}</div>`).join("");

  document.getElementById("shop-row").innerHTML = shops.map(s => `
    <div class="shop-card" data-goto="shop" data-shop="${s.id}">
      <div class="shop-avatar" style="background-image:url('${s.avatar}')"></div>
      <div class="name">${state.lang==="am" ? s.nameAm : s.nameEn}</div>
    </div>`).join("");

  const hideBrowse = state.query.trim().length > 0;
  document.getElementById("cat-section").style.display = hideBrowse ? "none" : "block";
  document.getElementById("featured-section").style.display = (hideBrowse || state.category !== "all" || !shops.length) ? "none" : "block";

  const list = filteredProducts();
  document.getElementById("product-grid").innerHTML = list.length ? list.map(productCard).join("") : emptyMessage();
}

function renderShopsList(){
  document.getElementById("lbl-shops-title").textContent = L().shops;
  document.getElementById("shops-list").innerHTML = shops.length ? shops.map(s => `
    <div class="from-shop" style="margin-bottom:10px;" data-goto="shop" data-shop="${s.id}">
      <img src="${s.avatar}" alt="" style="width:44px;height:44px;">
      <div>
        <div class="sname">${state.lang==="am" ? s.nameAm : s.nameEn}</div>
        <div class="lbl">@${s.channel} · ${s.products.length} ${state.lang==='am' ? 'ምርቶች' : 'items'}</div>
      </div>
    </div>`).join("") : emptyMessage();
}

function renderSaved(){
  document.getElementById("lbl-saved-title").textContent = L().saved;
  document.getElementById("empty-saved-text").textContent = L().savedEmpty;
}

function renderShopDetail(){
  const s = shops.find(x => x.id === state.shopId);
  if(!s) return;
  document.getElementById("shop-detail-title").textContent = state.lang==="am" ? s.nameAm : s.nameEn;
  document.getElementById("shop-detail-name").textContent = state.lang==="am" ? s.nameAm : s.nameEn;
  document.getElementById("shop-detail-avatar").style.backgroundImage = `url('${s.avatar}')`;
  document.getElementById("shop-detail-tg").textContent = "@" + s.channel;
  document.getElementById("shop-detail-grid").innerHTML = s.products.map(p => productCard({ ...p, shop: s })).join("");
}

function renderProductDetail(){
  const s = shops.find(x => x.id === state.shopId);
  const p = s && s.products.find(x => x.id === state.productId);
  if(!p) return;
  document.getElementById("lbl-product-title").textContent = state.lang==="am" ? s.nameAm : s.nameEn;
  document.getElementById("product-img").src = p.img;
  document.getElementById("product-price").textContent = fmt(p.price);
  document.getElementById("lbl-from-shop").textContent = L().fromShop;
  document.getElementById("product-shop-name").textContent = state.lang==="am" ? s.nameAm : s.nameEn;
  document.getElementById("product-shop-avatar").src = s.avatar;
  document.getElementById("product-desc").textContent = p.desc;
  const cta = document.getElementById("product-cta");
  cta.textContent = L().messageOnTelegram;
  cta.href = "https://t.me/" + s.contact;
  cta.className = "cta primary";
}

function renderStaticLabels(){
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = L()[el.getAttribute('data-t')]; });
  document.getElementById("btn-lang-en").classList.toggle("active", state.lang==="en");
  document.getElementById("btn-lang-am").classList.toggle("active", state.lang==="am");
  document.body.classList.toggle("lang-am", state.lang==="am");
}

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function render(){
  renderStaticLabels();

  // Data can change under the visitor (an item sells while they're looking at it),
  // so step back to a screen that still exists.
  const shop = shops.find(x => x.id === state.shopId);
  if(state.screen === "product" && !(shop && shop.products.some(p => p.id === state.productId))){
    state.screen = shop ? "shop" : null;
  }
  if(state.screen === "shop" && !shop) state.screen = null;

  renderHome();
  renderShopsList();
  renderSaved();
  if(shop) renderShopDetail();
  if(state.screen === "product") renderProductDetail();

  if(state.screen === "product") showScreen("screen-product");
  else if(state.screen === "shop") showScreen("screen-shop");
  else if(state.tab === "shops") showScreen("screen-shops");
  else if(state.tab === "saved") showScreen("screen-saved");
  else showScreen("screen-home");

  document.querySelectorAll(".navbtn").forEach(b => b.classList.toggle("active", b.dataset.tab === state.tab && !state.screen));
}

async function loadData(){
  try{
    const res = await fetch(API_BASE + "/api/products");
    if(!res.ok) throw new Error("HTTP " + res.status);
    const next = transformData(await res.json());
    const snapshot = JSON.stringify(next);
    const changed = snapshot !== lastSnapshot || loadState !== "ready";
    shops = next;
    lastSnapshot = snapshot;
    loadState = "ready";
    if(changed) render();
  }catch(err){
    console.error("Could not load products:", err);
    if(loadState !== "ready"){ loadState = "error"; render(); }
  }
}

document.getElementById("phone").addEventListener("click", (e) => {
  if(e.target.closest("[data-retry]")){ loadState = "loading"; render(); loadData(); return; }

  const gotoEl = e.target.closest("[data-goto]");
  if(gotoEl){
    state.shopId = gotoEl.dataset.shop;
    if(gotoEl.dataset.goto === "product"){
      state.productId = gotoEl.dataset.product;
      state.screen = "product";
    } else {
      state.productId = null;
      state.screen = "shop";
    }
    render();
    window.scrollTo(0, 0);
    return;
  }
  const chipEl = e.target.closest("[data-cat]");
  if(chipEl){ state.category = chipEl.dataset.cat; render(); return; }

  const navEl = e.target.closest(".navbtn");
  if(navEl){ state.tab = navEl.dataset.tab; state.screen = null; render(); return; }

  if(e.target.id === "btn-lang-en"){ state.lang = "en"; render(); return; }
  if(e.target.id === "btn-lang-am"){ state.lang = "am"; render(); return; }

  if(e.target.id === "shop-back" || e.target.closest("#shop-back")){ state.screen = null; render(); return; }
  if(e.target.id === "product-back" || e.target.closest("#product-back")){ state.screen = "shop"; render(); return; }
});

document.getElementById("search-input").addEventListener("input", (e) => {
  state.query = e.target.value; render();
});

render();
loadData();
setInterval(loadData, REFRESH_MS);
</script>
</body>
</html>
